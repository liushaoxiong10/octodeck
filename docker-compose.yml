version: "3.8"

services:
  octodeck:
    build:
      context: .
      dockerfile: Dockerfile
    image: octodeck:latest
    container_name: octodeck
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-octodeck-data}:/app/data
    environment:
      - WEB_PORT=3000
      - TZ=Asia/Shanghai

volumes:
  octodeck-data:
