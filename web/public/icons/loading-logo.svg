<svg width="880" height="180" viewBox="0 0 880 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OctoDeck">
  <title>OctoDeck</title>
  <style>
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: .32; transform: scale(1); }
      50% { opacity: .08; transform: scale(1.08); }
    }
    .octo-mark { animation: floaty 1.8s ease-in-out infinite; transform-origin: 90px 90px; }
    .octo-ring { animation: pulseRing 1.8s ease-in-out infinite; transform-origin: 90px 90px; }
    .wordmark { animation: floaty 1.8s ease-in-out infinite; animation-delay: .12s; }
  </style>
  <g class="octo-ring">
    <rect x="12" y="12" width="156" height="156" rx="40" fill="#F57F28"/>
  </g>
  <g class="octo-mark" transform="translate(18 18)">
    <rect width="144" height="144" rx="34" fill="#FFF9E0"/>
    <path d="M110 47c12 13 23 28 28 45 5 18 3 38 1 53" stroke="#F57F28" stroke-width="9" stroke-linecap="round"/>
    <path d="M88 107c12 0 24 2 35 8" stroke="#F57F28" stroke-width="9" stroke-linecap="round"/>
    <path d="M50 48c-25 28-34 70-20 103 17 41 75 40 101 8" stroke="#F57F28" stroke-width="14" stroke-linecap="round"/>
    <path d="M58 57c21-18 51-20 73-4 23 17 28 48 12 72-14 22-44 30-67 15-19-13-24-40-9-57 12-14 34-17 48-5" stroke="#F57F28" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="93" r="7" fill="#F57F28"/>
  </g>
  <text class="wordmark" x="194" y="115" fill="#F57F28" font-family="Alibaba PuHuiTi 3.0, 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="900" letter-spacing="-3">OctoDeck</text>
</svg>
